name: "Upgrade and release lucide"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  actions: write
  contents: write

env:
  UPSTREAM_OWNER: lucide-icons
  UPSTREAM_REPO: lucide
  LAST_RELEASE_FILE: .lucide_latest_release
  BASE_BRANCH: main

jobs:
  check-and-upgrade:
    runs-on: ubuntu-latest
    concurrency:
      group: lucide-upgrade
      cancel-in-progress: false

    steps:
    - name: Checkout repository (full history)
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Restore APT cache
      uses: actions/cache@v4
      id: apt-cache
      with:
        path: /var/cache/apt/archives
        key: apt-cache-${{ runner.os }}-v1

    - name: Install packages
      run: |
        sudo apt update -y
        sudo apt install -y --no-install-recommends jq libarchive-tools unzip curl

    - name: Get latest release tag from lucide-icons/lucide
      id: upstream
      run: |
        set -euo pipefail
        api="https://api.github.com/repos/${{ env.UPSTREAM_OWNER }}/${{ env.UPSTREAM_REPO }}/releases/latest"
        body=$(curl -fsSL -H "Accept: application/vnd.github+json" "$api")
        tag=$(echo "$body" | jq -r .tag_name)
        if [ -z "$tag" ] || [ "$tag" = "null" ]; then
          echo "No release tag found upstream."
          echo "latest_tag=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "latest_tag=$tag" >> "$GITHUB_OUTPUT"

    - name: Read latest recorded release
      id: last
      run: |
        if [ -f "${{ env.LAST_RELEASE_FILE }}" ]; then
          last=$(tr -d ' \t\n\r' < "${{ env.LAST_RELEASE_FILE }}")
        else
          last=""
        fi
        echo "last_release=$last" >> "$GITHUB_OUTPUT"

    - name: Decide whether to upgrade
      id: decide
      run: |
        latest="${{ steps.upstream.outputs.latest_tag }}"
        last="${{ steps.last.outputs.last_release }}"
        if [ -z "$latest" ] || [ "$latest" = "$last" ]; then
          echo "no_new_release=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "no_new_release=false" >> "$GITHUB_OUTPUT"

    - name: Setup Dart SDK
      if: steps.decide.outputs.no_new_release == 'false'
      uses: dart-lang/setup-dart@v1
      with:
        sdk: stable

    - name: Upgrade Lucide and commit to main
      if: steps.decide.outputs.no_new_release == 'false'
      id: upgrade
      run: |
        set -euo pipefail
        latest="${{ steps.upstream.outputs.latest_tag }}"
        version="${latest#v}"
        base="${{ env.BASE_BRANCH }}"

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git fetch --no-tags origin "$base"
        git checkout "$base"
        git reset --hard "origin/$base"

        chmod +x ./scripts/upgrade.sh
        ./scripts/upgrade.sh "$version"
        echo "$latest" > "${{ env.LAST_RELEASE_FILE }}"

        git add -A
        if git diff --cached --quiet; then
          echo "No changes produced by upgrade script."
          exit 0
        fi

        git commit -m "[chore] upgrade lucide to ${latest}"
        git push origin "$base"

        echo "latest=$latest" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Create GitHub release
      if: steps.upgrade.outputs.commit != ''
      run: |
        set -euo pipefail
        tag="v${{ steps.upgrade.outputs.version }}"
        gh release create "$tag" \
          --target "${{ steps.upgrade.outputs.commit }}" \
          --title "$tag" \
          --generate-notes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish the release to pub.dev
      if: steps.upgrade.outputs.commit != ''
      run: |
        set -euo pipefail
        tag="v${{ steps.upgrade.outputs.version }}"
        gh workflow run pub-publish.yml --ref "$tag"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
